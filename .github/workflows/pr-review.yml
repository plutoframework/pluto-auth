name: Pluto PR review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Check", "Pluto security", "Notify PR review", "CodeQL"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to reevaluate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pluto-review-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  review:
    uses: plutoframework/pluto/.github/workflows/pr-review-shared.yml@4a6ff0dace585eb9e4631b8aceb33ec22a326553
    with:
      policy_revision: 4a6ff0dace585eb9e4631b8aceb33ec22a326553
