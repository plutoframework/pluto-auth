version: "2"
sql:
  - engine: "postgresql"
    queries: ["queries.sql", "local_queries.sql"]
    schema: ["schema.sql", "migrations/002_local_credentials.sql", "migrations/003_authentication.sql"]
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
